# Local development database only. Production setup: see deploy/.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tattai
      POSTGRES_PASSWORD: tattai
      POSTGRES_DB: tattai
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
