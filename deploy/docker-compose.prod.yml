# Production stack for a single EU server (e.g. Hetzner Cloud CX22).
# Usage (in repo root): docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tattai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tattai}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tattai}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: .., target: builder }
    env_file: ../.env
    command: npx prisma migrate deploy
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: .., target: runner }
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background worker: WhatsApp sending (staggered) and retries of failed Meta lead fetches.
  worker:
    build: { context: .., target: builder }
    restart: unless-stopped
    env_file: ../.env
    command: npx tsx scripts/worker.ts
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  db-data:
  caddy-data:
