# Production stack for a single EU server (e.g. IONOS VPS, 4 GB RAM).
# Usage (in repo root): docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-needl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-needl}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-needl}"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: .., target: builder }
    env_file: ../.env
    command: npx prisma migrate deploy
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: .., target: runner }
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Background worker: WhatsApp sending (staggered) and retries of failed Meta lead fetches.
  worker:
    build: { context: .., target: builder }
    restart: unless-stopped
    env_file: ../.env
    command: npx tsx scripts/worker.ts
    user: "1001:1001"
    environment:
      MEDIA_STORAGE_DIR: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      # Public website (e.g. needl-booker.de); optional, the fallback is a local-only name
      SITE_DOMAIN: ${SITE_DOMAIN:-needl-site.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  db-data:
  # Private customer files (reference images), shared by app and worker
  media-data:
  caddy-data:
